# agent_group 配置

agents:
  # main_agent 主agent 优先级最高 使用最优模型 使用一切工具
  - agent_id: 001
    agent_name: main
    agent_mode: auto
    agent_tool_autho:
      basic_tool: true
      advance_tool: true
      file_read_tool: true
      file_write_tool: true
      command_tool: true
      config_tool: true
      memory_tool: true
      plan_tool: true
      subagent_tool: true
      web_tool: true
      skill_tool: true
      mcp_tool: true
      interaction_tool: true
    agent_level: medium_level
    agent_priority: 0
    agent_switch: true
    agent_desc: "身份:主agent 负责 主要交流调用工具&对外感知对外对话"
  
  # slice agent 身份 切片agent 负责 对经历流进行slice切分
  - agent_id: 002
    agent_name: slice
    agent_mode: auto
    agent_tool_autho:
      basic_tool: false
      advance_tool: false
      file_read_tool: false
      file_write_tool: false
      command_tool: false
      config_tool: false
      memory_tool: false
      plan_tool: false
      subagent_tool: false
      web_tool: false
      skill_tool: false
      mcp_tool: false
    agent_level: medium_level
    agent_priority: 1
    agent_switch: true
    agent_desc: "身份 切片agent 负责 对经历流进行slice切分"

  # summary agent 身份 总结agent 负责 对已确定的slice进行summary总结
  - agent_id: 003
    agent_name: summary
    agent_mode: auto
    agent_tool_autho:
      basic_tool: false
      advance_tool: false
      file_read_tool: false
      file_write_tool: false
      command_tool: false
      config_tool: false
      memory_tool: false
      plan_tool: false
      subagent_tool: false
      web_tool: false
      skill_tool: false
      mcp_tool: false
    agent_level: medium_level
    agent_priority: 1
    agent_switch: true
    agent_desc: "身份 总结agent 负责 对已确定的slice进行summary总结"

  # plan agent 身份 计划agent 负责 对任务目标制定计划
  - agent_id: 004
    agent_name: plan
    agent_mode: auto
    agent_tool_autho:
      basic_tool: true
      advance_tool: false
      file_read_tool: true
      file_write_tool: false
      command_tool: false
      config_tool: false
      memory_tool: true
      plan_tool: false
      subagent_tool: true
      web_tool: true
      skill_tool: true
      mcp_tool: true
    agent_level: medium_level
    agent_priority: 1
    agent_switch: true
    agent_desc: "身份 计划agent 负责 对任务目标制定计划"

  # memory_type agent 身份 slice分类agent 负责 对slice进行分类
  - agent_id: 005
    agent_name: memory
    agent_mode: auto
    agent_tool_autho:
      basic_tool: false
      advance_tool: false
      file_read_tool: false
      file_write_tool: false
      command_tool: false
      config_tool: false
      memory_tool: true
      plan_tool: false
      subagent_tool: false
      web_tool: false
      skill_tool: false
      mcp_tool: false
    agent_level: low_level
    agent_priority: 1
    agent_switch: true
    agent_desc: "身份 slice分类agent 负责 对slice进行分类"


