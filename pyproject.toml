[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alear030"
version = "0.1.0"
description = "Alear030 long mem&learn harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "json-repair==0.61",
    "openai==2.24.0", 
    "pyyaml==6.0.3",
    "tiktoken==0.13.0",
    "rich==14.3.3",
    # TUI 主线 tui/tui_core.py 顶层 import;缺了 main.py 启动即失败
    "textual==8.2.7",
    "sentence-transformers==5.6.0",
    # transformers 在 local_model_core 里显式 import;modelscope 用于权重缺失时自动下载
    "transformers==5.12.1",
    "modelscope==1.37.1",
    # MCP 客户端:mcp_client/ 顶层 import,主线装配依赖它;包名不能与本地目录 mcp_client 混淆
    "mcp==1.27.2",
    "ddgs==9.14.4",
    "requests==2.33.0",
    "beautifulsoup4==4.15.0",
    "numpy==2.4.5",
    "python-dotenv==1.2.1",
]

[project.scripts]
alear030 = "main:main"

# 只纳入 main.py 作为 alear030 命令入口；其余顶层包不打包（flat layout 下自动发现会报错），
# 由 main.py 顶部补 sys.path 从仓库原地读取，故须 pip install -e .，普通 pip install . 启动即缺包。
[tool.setuptools]
packages = []
py-modules = ["main"]
