[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alear030"
version = "0.1.0"
description = "Alear030 long mem&learn harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "json-repair==0.61",
    "openai==2.24.0", 
    "pyyaml==6.0.3",
    "tiktoken==0.13.0",
    "rich==14.3.3",
    # TUI 主线 tui/tui_core.py 顶层 import;缺了 main.py 启动即失败
    "textual==8.2.7",
    "sentence-transformers==5.6.0",
    # transformers 在 local_model_core 里显式 import;modelscope 用于权重缺失时自动下载
    "transformers==5.12.1",
    "modelscope==1.37.1",
    "ddgs==9.14.4",
    "requests==2.33.0",
    "beautifulsoup4==4.15.0",
    "numpy==2.4.5",
    "python-dotenv==1.2.1",
]

# Alear030 是从仓库根目录 python main.py 运行的应用，不作为库被外部 import。
# pip install -e . 的用途仅是装依赖，故显式声明不打包任何模块——
# 否则 flat layout 下 setuptools 自动发现会因根目录多个顶层包而报错。
[tool.setuptools]
packages = []
